[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-leakage-canary"
version = "0.1.0"
description = "Synthetic honeytoken injector and monitoring agent detecting unauthorized context leakage"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-context-leakage-canary = "agent_context_leakage_canary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_context_leakage_canary*"]
